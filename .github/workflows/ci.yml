
name: Node.js CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      SECURITY_GROUP_ID: sg-026a547a176ad80a3
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: dist/
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311681428483:role/Horilyi-GitHub-Deploy-Role
          aws-region: eu-north-1

      - name: Detect runner IP
        id: runner_ip
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')
          echo "cidr=${IP}/32" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH
        id: ssh_access
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner_ip.outputs.cidr }}"

      - name: Prepare SSH authentication
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          HOST_PUBLIC_KEY: ${{ secrets.EC2_HOST_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s %s\n' "$EC2_HOST" "$HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy files to EC2
        run: |
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            -r dist/. \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/deploy/"

      - name: Start application on EC2
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          sudo tee /etc/systemd/system/horilyi-web.service >/dev/null <<'SERVICE'
          [Unit]
          Description=Horilyi Node CI demo web server
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 127.0.0.1 --directory /home/ubuntu/deploy
          Restart=always

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable horilyi-web.service
          sudo systemctl restart horilyi-web.service

          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/ | grep -q 'Hello CI'; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment verification failed"
          exit 1
          REMOTE

      - name: Remove temporary SSH access
        if: ${{ always() && steps.ssh_access.outcome == 'success' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner_ip.outputs.cidr }}"

      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
