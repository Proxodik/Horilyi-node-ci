
name: Deploy to EC2 via SSM

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ec2-ssm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'Proxodik/Horilyi-node-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311681428483:role/Horilyi-GitHub-Deploy-Role
          aws-region: eu-north-1

      - name: Prepare deployment commands
        run: |
          cat > ssm-params.json <<'EOF'
          {
            "commands": [
              "set -eu",
              "docker pull illiadevops/horilyi-node-ci:latest",
              "docker rm -f horilyi-terraform-app || true",
              "docker run -d --name horilyi-terraform-app --restart unless-stopped -p 127.0.0.1:3000:3000 illiadevops/horilyi-node-ci:latest",
              "sleep 3",
              "curl --fail --silent --show-error http://127.0.0.1:3000"
            ]
          }
          EOF

      - name: Deploy through AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0b3b1d39b6f4f286d \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0b3b1d39b6f4f286d \
              --query Status --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0b3b1d39b6f4f286d \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0b3b1d39b6f4f286d \
                  --query StandardErrorContent \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment verification timed out"
          exit 1
